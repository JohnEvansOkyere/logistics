name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Format check
        run: corepack pnpm format:check

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test

      # Local Supabase stack in Docker: PostgreSQL, Auth schema and roles.
      # No remote project, secret or deployment is involved.
      - name: Start local Supabase
        run: corepack pnpm supabase:start

      - name: Database policy tests (pgTAP)
        run: corepack pnpm supabase:test

      - name: API end-to-end tests (local PostgreSQL)
        run: corepack pnpm test:e2e

      - name: Build
        run: corepack pnpm build

      - name: Stop local Supabase
        if: always()
        run: corepack pnpm supabase:stop
